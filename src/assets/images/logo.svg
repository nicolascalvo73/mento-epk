<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" aria-label="mento">
  <!--
    Placeholder logo — paths traced as strokes so draw-in animation works.
    Replace the path data with the real brand SVG; keep fill/stroke via CSS vars.
    Each <path> gets a unique id so GSAP can target them individually.
  -->

  <!-- m -->
  <path id="logo-m"
    d="M10 80 L10 30 Q10 20 20 20 Q30 20 35 35 L50 65 L65 35 Q70 20 80 20 Q90 20 90 30 L90 80"
    stroke="var(--logo-stroke, currentColor)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- e -->
  <path id="logo-e"
    d="M110 50 Q110 20 130 20 Q150 20 150 50 Q150 80 130 80 Q110 80 110 50 Z M110 50 L148 50"
    stroke="var(--logo-stroke, currentColor)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- n -->
  <path id="logo-n"
    d="M170 80 L170 20 L210 80 L210 20"
    stroke="var(--logo-stroke, currentColor)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- t -->
  <path id="logo-t-stem"
    d="M250 20 L250 80"
    stroke="var(--logo-stroke, currentColor)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path id="logo-t-bar"
    d="M230 30 L270 30"
    stroke="var(--logo-stroke, currentColor)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- o -->
  <path id="logo-o"
    d="M290 50 Q290 20 310 20 Q330 20 330 50 Q330 80 310 80 Q290 80 290 50 Z"
    stroke="var(--logo-stroke, currentColor)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
